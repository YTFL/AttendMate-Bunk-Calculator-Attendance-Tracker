name: attendmate_storage
description: Native storage and SAF file channel for AttendMate across foreground and background isolates
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.ytfl.attendmate.storage
        pluginClass: AttendmateStoragePlugin
